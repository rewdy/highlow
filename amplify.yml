version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g bun
        - bun install
    build:
      commands:
        - bun run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
customHeaders:
  - pattern: '**/*.css'
    headers:
      - key: 'Content-Type'
        value: 'text/css'
  - pattern: '**/*.js'
    headers:
      - key: 'Content-Type'
        value: 'application/javascript'
  - pattern: '**/*.json'
    headers:
      - key: 'Content-Type'
        value: 'application/json'
  - pattern: '**/*.svg'
    headers:
      - key: 'Content-Type'
        value: 'image/svg+xml'